
{if $payment_method == 'form'}
{if $auto_submit}
    <i class="icon16 loading"></i> <em>{$form_desc}</em>
    <br /><br />
    <script type="text/javascript">
        setTimeout(function() {
            document.location.href = '{$form_url|escape:'javascript'}';
        }, 2000);
    </script>
{/if}
<button onclick="document.location.href = '{$form_url|escape:'javascript'|escape:'html'}'">{$form_btn}</button>
{/if}
{if $payment_method == 'direct' && $three_d_secure}
{$html}
{/if}
{if $payment_method == 'direct' && !$three_d_secure}
<i class="icon16 loading"></i> <em>{$form_desc}</em>
<br /><br />
<script type="text/javascript">
    setTimeout(function() {
        document.location.href = '{$form_url|escape:'javascript'}';
    }, 2000);
</script>
<button onclick="document.location.href = '{$form_url|escape:'javascript'|escape:'html'}'">{$form_btn}</button>
{/if}
